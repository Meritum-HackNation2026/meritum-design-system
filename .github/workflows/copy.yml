name: Copy

# Checks copy/pl.json: the keys screens need, a text for every contract code
# (tests/test_contract_copy.py) and the tone of DESIGN_SYSTEM.md section 8
# (tests/test_copy.py). The AnalysisSteps renderer test also runs in Node.
# tests/test_text_encoding.py checks that every Python text read, write and
# subprocess pipe names its encoding (ruff PLW1514), so presentation/ scripts count too.
# Runs on the GCP runners.
on:
  push:
    branches: ["**"]
    paths: ["copy/**", "contracts/**", "docs/**", "extension/reference/**", "tests/**", "presentation/**/*.py", ".github/workflows/copy.yml"]

permissions:
  contents: read

jobs:
  keys:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.8.0"
          package-manager-cache: false
      - name: Copy keys and tone
        run: python3 -m unittest discover -s tests -v
