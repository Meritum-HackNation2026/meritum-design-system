<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meritum: karta wyniku na platformach</title>
<link rel="icon" href="../../brand/meritum-mark.svg">
<link rel="stylesheet" href="../../extension/ui.css">
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
body{background:var(--bg);padding:32px 24px 80px}
.wrap{max-width:1240px;margin:0 auto}
h1{font:750 28px/1.15 var(--brand);font-stretch:110%;letter-spacing:-.01em}
.lead{max-width:70ch;margin-top:8px;color:var(--ink2);font-size:15px;line-height:22px}
.ctl{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:18px;padding:12px 0;background:var(--bg)}
.ctl fieldset{display:flex;flex-wrap:wrap;gap:6px;border:0}
.ctl legend{float:left;margin-right:6px;font:600 13px/30px var(--brand);color:var(--ink2)}
.ctl label{position:relative;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:600 13px var(--brand);cursor:pointer}
.ctl label:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--card)}
.ctl label:has(input:focus-visible){outline:2px solid var(--sea);outline-offset:2px}
.ctl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;margin-top:8px}
figure{display:grid;gap:6px;align-content:start}
figcaption{font:600 13px var(--brand);color:var(--ink2)}
.frame{padding:12px 14px 14px;border-radius:12px}
.frame.light{background:#fff;border:1px solid #E1E4E8}
.frame.dark{background:#000;border:1px solid #2F3336}
.frame[data-p="facebook"].light{background:#fff}.frame[data-p="facebook"].dark{background:#252728}
.frame[data-p="reddit"].dark{background:#0E1113}
.frame[data-p="tiktok"].dark{background:#121212}
</style>
</head>
<body>
<div class="wrap">
 <h1>Karta wyniku na pięciu platformach</h1>
 <p class="lead">Rama od gospodarza, sygnał od Meritum: krój, promień, tło i kolor linków biorą się z platformy, a znak, werdykt, źródła z cytatem i informacja o AI zostają zawsze. Rysuje je ten sam kod co wtyczka, z danymi z atrapy API. Cytaty są ilustracyjne.</p>
 <form class="ctl" aria-label="Co pokazać">
  <fieldset><legend>Wynik</legend>
   <label><input type="radio" name="r" value="false" checked>Fałszywe</label>
   <label><input type="radio" name="r" value="abstain">Brak dowodów i sprawa</label>
   <label><input type="radio" name="r" value="conflict">Sprzeczne źródła</label>
   <label><input type="radio" name="r" value="out">Poza zakresem</label>
   <label><input type="radio" name="r" value="steps">Pasek analizy</label>
  </fieldset>
 </form>
 <div class="grid" data-grid></div>
</div>
<script>window.MERITUM_SPEED = 1000;</script>
<script src="../../extension/reference/api.js"></script>
<script src="../../extension/reference/card.js"></script>
<script>
(async () => {
  const T = await (await fetch('../../copy/pl.json')).json();
  MeritumCard.use(T);
  const sheet = new CSSStyleSheet();
  sheet.replaceSync(await (await fetch('../../extension/widget.css')).text());
  const fonts = new CSSStyleSheet();
  fonts.replaceSync((sheet.cssRules ? [...sheet.cssRules].filter(r => r instanceof CSSFontFaceRule).map(r => r.cssText) : []).join('\n'));
  document.adoptedStyleSheets = [...document.adoptedStyleSheets, fonts];

  let steps;
  const ask = text => MeritumAPI.check({ channel: 'extension', text }, s => { if (s.draft) steps = s; });
  const conflict = {
    check_id: 'c_03', status: 'done', corpus_version: 'przykład', ai_disclosure: true,
    claims: [{
      claim: 'Od 1 stycznia 2027 r. sklepy nie muszą przyjmować płatności gotówką.', claim_date: '2027-01-01', claim_date_source: 'text', verdict: 'insufficient_evidence',
      citations: [
        { source: { id: 'nbp', title: 'Obowiązek przyjmowania gotówki', publisher: 'Narodowy Bank Polski', publisher_id: 'nbp', url: 'https://nbp.pl/', domain: 'nbp.pl', kind: 'instytucja', tier: 'primary', published_at: '2026-10-02T00:00:00+02:00', fetched_at: '2026-11-21T08:00:00+01:00' }, fragment: 'Sprzedawca detaliczny nie może odmówić przyjęcia zapłaty gotówką.', stance: 'refutes' },
        { source: { id: 'portal', title: 'Rząd zapowiada zmiany w płatnościach', publisher: 'Portal informacyjny', publisher_id: 'portal', url: 'https://example.org/', domain: 'example.org', kind: 'media', tier: 'secondary', published_at: '2026-11-18T00:00:00+01:00', fetched_at: '2026-11-21T08:00:00+01:00', via: 'web_search' }, fragment: 'Projekt przewiduje, że od nowego roku część sklepów zrezygnuje z gotówki.', stance: 'supports' },
      ],
      explanation: 'Obowiązujące przepisy każą przyjmować gotówkę, a jeden serwis pisze o projekcie zmiany.',
      unresolved: 'NBP opisuje obowiązujące prawo, a serwis informacyjny projekt, którego nie ma jeszcze w ISAP.', technique: 'outdated',
    }],
    escalation: { state: 'recommended' }, limitations: ['Przykład do pokazu: fragmenty źródeł są ilustracyjne.'],
  };
  const DATA = {
    false: await ask('Ziemia jest płaska, z samolotu nie widać krzywizny'),
    abstain: await ask('Tomasz Rewiński po latach zdradza, jak zarabia 1 200 zł dziennie'),
    conflict,
    out: await ask('Pierwszy śnieg w Zakopanem. Kto jedzie w ten weekend?'),
  };

  const PLATFORMS = [['x', 'X'], ['facebook', 'Facebook'], ['instagram', 'Instagram'], ['reddit', 'Reddit'], ['tiktok', 'TikTok']];
  const grid = document.querySelector('[data-grid]');
  const hosts = [];
  for (const [p, name] of PLATFORMS) for (const mode of ['light', 'dark']) {
    const fig = document.createElement('figure');
    fig.innerHTML = `<figcaption>${name}, ${mode === 'light' ? 'jasny' : 'ciemny'}</figcaption><div class="frame ${mode}" data-p="${p}"></div>`;
    const host = document.createElement('meritum-root');
    host.dataset.host = p; host.dataset.part = 'slot';
    host.style.display = 'block';
    if (mode === 'dark') host.classList.add('dark');
    host.attachShadow({ mode: 'open' }).adoptedStyleSheets = [sheet];
    fig.querySelector('.frame').append(host);
    grid.append(fig);
    hosts.push(host);
  }
  const show = v => {
    for (const h of hosts) h.shadowRoot.innerHTML = v === 'steps' ? `<output class="m-proc" style="margin-top:0">${MeritumCard.steps(steps)}</output>` : MeritumCard.card(DATA[v]);
    for (const c of document.querySelectorAll('meritum-root')) c.shadowRoot.querySelector('.m-card')?.style.setProperty('margin-top', '0');
  };
  document.querySelector('.ctl').addEventListener('change', e => show(e.target.value));
  show('false');
})();
</script>
</body>
</html>
